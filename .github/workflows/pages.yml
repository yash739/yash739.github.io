name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Index research pages
        run: python3 scripts/build_index.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html project.html assets research _site/
          rm -f _site/research/_TEMPLATE.md
      - name: Version asset URLs (cache busting)
        run: sed -i -E "s#(assets/[A-Za-z0-9_./-]+\.(css|js|png|jpg|pdf))#\1?v=${GITHUB_SHA::7}#g" _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
